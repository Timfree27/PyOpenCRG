[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "PyOpenCRG"
dynamic = ["version"]
description = "Read, analyse, edit, show and write OpenCRG road surface files in pure Python (unofficial, not affiliated with ASAM)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
authors = [{ name = "Timothé Hardy" }]
keywords = ["OpenCRG", "CRG", "road", "road surface", "vehicle simulation", "ASAM", "tyre", "durability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# the core (read, check, evaluate, edit, write) only needs numpy
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
scipy = ["scipy>=1.8"]          # smoothing, filters, re-sampling of curved roads, scan repair, import of point clouds
plot = ["matplotlib>=3.5"]      # figures and image export
viewer = ["pyvista>=0.38"]      # interactive 3D viewer
image = ["pillow>=9"]           # engrave_image()
all = ["scipy>=1.8", "matplotlib>=3.5", "pyvista>=0.38", "pillow>=9"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Timfree27/PyOpenCRG"
Documentation = "https://github.com/Timfree27/PyOpenCRG#readme"
Issues = "https://github.com/Timfree27/PyOpenCRG/issues"

[project.scripts]
pyopencrg = "pyopencrg.cli:main"

[tool.hatch.version]
path = "src/pyopencrg/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pyopencrg"]

[tool.hatch.build.targets.sdist]
include = ["src/pyopencrg", "tests", "docs", "examples", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE", "CITATION.cff", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# some test files contain NaN values on purpose
filterwarnings = ["ignore::pyopencrg.checks.CrgCheckWarning"]
